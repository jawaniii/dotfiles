# ~/.tmux.conf — Catppuccin Mocha, DOCKER-101 personal dashboard

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 10
set -g history-limit 10000

# --- Catppuccin Mocha status bar ---
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"
set -g status-left-length 20
set -g status-right "#[fg=#a6e3a1]#[bg=#a6e3a1,fg=#1e1e2e,bold] %H:%M #[bg=#1e1e2e,fg=#a6e3a1]"
set -g status-justify centre

setw -g window-status-current-style "bg=#cba6f7,fg=#1e1e2e,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#6c7086"
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#1e1e2e,bold"

# --- DOCKER-101: toggle the btop pane on/off without killing the session ---
bind-key b run-shell "~/.local/bin/tmux-toggle-btop"
